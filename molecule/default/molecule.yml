driver:
  name: docker

platforms:
  - name: debian-trixie
    image: debian:trixie-20261104
    dockerfile: Dockerfile.j2
    pre_build_image: false
    # systemd runs as PID 1, so journald behaves as on a real machine.
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible

verifier:
  name: ansible
