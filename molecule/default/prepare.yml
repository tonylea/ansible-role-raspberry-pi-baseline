# A container is not Pi OS, so give it the parts of a fresh Pi OS install this role changes.
- name: Prepare
  hosts: all
  tasks:
    - name: Create the boot partition's mount point
      ansible.builtin.file:
        path: /boot/firmware
        state: directory
        mode: "0755"

    # Pi OS's own default, from RPi-Distro/pi-gen tag 2026-10-06-raspios-trixie-arm64.
    - name: Add Pi OS's default config.txt
      ansible.builtin.copy:
        src: config.txt
        dest: /boot/firmware/config.txt
        mode: "0755"

    - name: Create the system journald drop-in directory
      ansible.builtin.file:
        path: /usr/lib/systemd/journald.conf.d
        state: directory
        mode: "0755"

    # Pi OS's own drop-in from its raspberrypi-sys-mods package, which keeps the journal in RAM only.
    - name: Keep the journal in RAM, as Pi OS does
      ansible.builtin.copy:
        dest: /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
        content: |
          [Journal]
          Storage=volatile
        mode: "0644"

    - name: Restart journald with Pi OS's settings
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
